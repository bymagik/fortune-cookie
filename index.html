<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Makes the page fit phone screens properly -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Fortune</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <button id="cookie" aria-label="Crack open the fortune cookie">🥠</button>
  <p class="hint" id="hint">Tap to crack it open</p>

  <div id="slip">
    <p id="fortune"></p>
    <p id="author" class="author"></p>
    <p class="small">A new fortune awaits tomorrow</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
